---
ansible:
  cfg:
    defaults:
      deprecation_warnings: false
  env:
    # Repository collections first, so scenarios test the working copy rather than an installed release
    ANSIBLE_COLLECTIONS_PATH: ${MOLECULE_SCENARIO_DIRECTORY}/../../../../../../../collections/:$HOME/.ansible/collections
  executor:
    backend: ansible-playbook
    args:
      ansible_playbook:
        - --inventory=${MOLECULE_SCENARIO_DIRECTORY}/inventory/

dependency:
  name: galaxy
  options:
    role-file: ${MOLECULE_SCENARIO_DIRECTORY}/../requirements.yml
    requirements-file: ${MOLECULE_SCENARIO_DIRECTORY}/../requirements.yml

scenario:
  test_sequence:
    - dependency
    - destroy
    - create
    - converge
    - verify
    - idempotence
    - destroy
