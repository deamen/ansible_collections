name: Check changelog fragment
on:
  workflow_call:

jobs:
  check_changelog_fragment:
    name: Require changelog fragment
    runs-on: ubuntu-latest
    # Add the skip-changelog label to a PR that needs no changelog entry
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          show-progress: false

      - name: Check each changed collection has a fragment
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          # Collections with user-facing changes: plugins/, roles/, playbooks/ or meta/
          collections=$(echo "$changed" | grep -oP '^collections/ansible_collections/[^/]+/[^/]+(?=/(plugins|roles|playbooks|meta)/)' | sort -u)
          rc=0
          for collection in $collections; do
            # A release in the same PR consumes the fragments into changelog.yaml
            if echo "$changed" | grep -qP "^${collection}/changelogs/(fragments/(?!\.keep$)|changelog\.yaml$)"; then
              echo "OK: $collection has a changelog fragment"
            else
              echo "::error::$collection changed but has no fragment in changelogs/fragments/ or release in changelogs/changelog.yaml; add one, or label the PR skip-changelog"
              rc=1
            fi
          done
          exit $rc
