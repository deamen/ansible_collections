---
- name: Verify deamen.proton.install_proton_drive_cli
  hosts: molecule:&containers
  gather_facts: true

  vars:
    home: "{{ ansible_facts['env']['HOME'] }}"

  tasks:
    - name: Get the proton-drive binary
      ansible.builtin.stat:
        path: "{{ home }}/.local/bin/proton-drive"
      register: binary

    - name: Check the proton-drive binary
      ansible.builtin.assert:
        that:
          - binary.stat.exists
          - binary.stat.mode == '0755'
        quiet: true

    - name: Get the proton-drive version
      ansible.builtin.command: "{{ home }}/.local/bin/proton-drive version"
      register: proton_drive_version
      changed_when: false

    - name: Show the proton-drive version
      ansible.builtin.debug:
        var: proton_drive_version.stdout_lines

    - name: Get the Proton Drive CLI environment file
      ansible.builtin.stat:
        path: "{{ home }}/.bashrc.d/proton_drive_cli.sh"
      register: env_file

    - name: Check the Proton Drive CLI environment file
      ansible.builtin.assert:
        that:
          - env_file.stat.exists
          - env_file.stat.mode == '0644'
        quiet: true

    - name: Get the credentials store from the environment file
      ansible.builtin.command:
        argv:
          - bash
          - -c
          - source ~/.bashrc.d/proton_drive_cli.sh && echo "$PROTON_DRIVE_CREDENTIALS_STORE"
      register: credentials_store
      changed_when: false

    - name: Check the credentials store
      ansible.builtin.assert:
        that: credentials_store.stdout == 'unsafe_file'
        fail_msg: "Unexpected PROTON_DRIVE_CREDENTIALS_STORE: {{ credentials_store.stdout }}"
        quiet: true
