---
ancestor: null
releases:
  1.0.0:
    changes:
      release_summary: Initial release. The Ansible roles were moved here from ``deamen.general``.
    objects:
      role:
        - description: Configure Ansible runtime environment.
          name: config_ansible_runtime_env
          namespace: null
        - description: Install ansible from system package manager.
          name: install_system_ansible
          namespace: null
    release_date: '2026-04-04'
  1.0.1:
    changes:
      bugfixes:
        - config_ansible_runtime_env - check the ``molecule`` group is defined before
          checking membership.
      minor_changes:
        - install_system_ansible - remove role-level tests.
    release_date: '2026-04-05'
  1.0.2:
    changes:
      bugfixes:
        - Fix playbook relative path in molecule scenarios.
        - config_ansible_runtime_env - skip collection install when ``~/Prj/ansible/requirements.yml``
          is absent.
      minor_changes:
        - Declare dependency on ``deamen.general`` (used by ``configure_system_ansible_runtime_env.yml``).
        - Move molecule scenarios under ``extensions/``.
        - config_ansible_runtime_env - add ``install_molecule_via_pip`` option (default
          ``true``).
        - config_ansible_runtime_env - default ``ansible_pip_executable`` to ``/usr/bin/pip3``
          so it works on any Fedora release.
        - config_ansible_runtime_env - install molecule via pip.
        - configure_system_ansible_runtime_env.yml - configure the connecting user
          instead of root; only pip installs use become.
        - install_system_ansible - install ``sshpass``.
    release_date: '2026-11-01'
  1.0.3:
    changes:
      minor_changes:
        - Declare dependency on ``deamen.gpg`` (playbooks used by ``setup_ansible_vault_gpg.py``).
        - config_ansible_runtime_env - install GPG packages with ``deamen.gpg.install_gpg``.
        - config_ansible_runtime_env - install ``/usr/local/bin/ansible_vault_pass_gpg.sh``
          to read the Ansible Vault password from the GPG-encrypted ``~/.ansible_vault_pass.gpg``
          (override with ``ANSIBLE_VAULT_GPG_FILE``).
        - config_ansible_runtime_env - install ``/usr/local/bin/setup_ansible_vault_gpg.py``
          to create ``~/.ansible_vault_pass.gpg``, importing the GPG secret key from
          ``~/.gnupg/private_gpg.key`` by default.
        - config_ansible_runtime_env - install ``unversioned_python_packages`` (default
          ``python-unversioned-command``) for the ``#!/usr/bin/env python`` shebang
          of ``setup_ansible_vault_gpg.py``.
    fragments:
      - config_ansible_runtime_env-vault_pass_gpg.yml
    release_date: '2026-11-03'
  1.1.0:
    changes:
      minor_changes:
        - Add ``configure_ansible_development_env.yml`` playbook to install and configure
          a full Ansible development environment (system Ansible, dev packages, runtime
          env, Copilot CLI, podman and linear-cli).
        - Declare dependencies on ``deamen.podman`` and ``deamen.ai`` (roles used
          by ``configure_ansible_development_env.yml``).
    fragments:
      - add-configure-ansible-development-env.yml
    release_date: '2026-11-03'
  1.2.0:
    changes:
      minor_changes:
        - config_ansible_runtime_env - install ``/usr/local/bin/gpg_cat.sh``, a generic
          GPG decrypt script that reads the file from ``--gpg_file`` or the ``GPG_FILE``
          environment variable.
        - config_ansible_runtime_env - install ``antsibull-changelog`` with pip, used
          to release collections; set ``install_antsibull_changelog_via_pip=false``
          to skip it.
        - configure_ansible_development_env - install Claude Code for the connecting
          user with ``deamen.ai.install_claude_code``; ``deamen.ai`` is now required
          at ``>=2.1.0``.
    fragments:
      - antsibull_changelog.yml
      - gpg_cat.yml
      - install-claude-code.yml
    release_date: '2026-11-05'
  1.3.0:
    changes:
      minor_changes:
        - configure_ansible_development_env - install linear-cli after Claude Code,
          so ``deamen.ai.install_linear_cli`` installs the linear-cli skill into Claude
          Code. Requires ``deamen.ai`` 2.2.0 or later.
    fragments:
      - install-linear-cli-skill.yml
    release_date: '2026-11-07'
