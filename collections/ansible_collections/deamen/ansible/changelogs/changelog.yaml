---
ancestor: null
releases:
  1.0.0:
    changes:
      release_summary: Initial release. The Ansible roles were moved here from ``deamen.general``.
    objects:
      role:
        - description: Configure Ansible runtime environment.
          name: config_ansible_runtime_env
          namespace: null
        - description: Install ansible from system package manager.
          name: install_system_ansible
          namespace: null
    release_date: '2026-04-04'
  1.0.1:
    changes:
      bugfixes:
        - config_ansible_runtime_env - check the ``molecule`` group is defined before
          checking membership.
      minor_changes:
        - install_system_ansible - remove role-level tests.
    release_date: '2026-04-05'
  1.0.2:
    changes:
      bugfixes:
        - Fix playbook relative path in molecule scenarios.
        - config_ansible_runtime_env - skip collection install when ``~/Prj/ansible/requirements.yml``
          is absent.
      minor_changes:
        - Declare dependency on ``deamen.general`` (used by ``configure_system_ansible_runtime_env.yml``).
        - Move molecule scenarios under ``extensions/``.
        - config_ansible_runtime_env - add ``install_molecule_via_pip`` option (default
          ``true``).
        - config_ansible_runtime_env - default ``ansible_pip_executable`` to ``/usr/bin/pip3``
          so it works on any Fedora release.
        - config_ansible_runtime_env - install molecule via pip.
        - configure_system_ansible_runtime_env.yml - configure the connecting user
          instead of root; only pip installs use become.
        - install_system_ansible - install ``sshpass``.
    release_date: '2026-11-01'
