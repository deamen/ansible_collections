---
minor_changes:
  - config_ansible_runtime_env - install ``/usr/local/bin/ansible_vault_pass_gpg.sh`` to read the Ansible Vault password
    from the GPG-encrypted ``~/.ansible_vault_pass.gpg`` (override with ``ANSIBLE_VAULT_GPG_FILE``).
  - config_ansible_runtime_env - install ``/usr/local/bin/setup_ansible_vault_gpg.py`` to create ``~/.ansible_vault_pass.gpg``,
    importing the GPG secret key from ``~/.gnupg/private_gpg.key`` by default.
  - config_ansible_runtime_env - install GPG packages with ``deamen.gpg.install_gpg``.
  - Declare dependency on ``deamen.gpg`` (playbooks used by ``setup_ansible_vault_gpg.py``).
