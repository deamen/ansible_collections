---
# tasks file for config_ansible_runtime_env

- name: Symlink /tmp/ansible to ~/Prj/ansible for molecule testing and development
  ansible.builtin.file:
    src: "/tmp/ansible"
    dest: "{{ ansible_user_dir }}/Prj/ansible"
    state: link
  when:
    - groups['molecule'] is defined
    - inventory_hostname in groups['molecule']

- name: Check if requirements.yml exists
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/Prj/ansible/requirements.yml"
  register: requirements_yml_stat

# Skipped when there is no checkout, e.g. container images install the published collections instead
- name: Install ansible collections in dev environment
  ansible.builtin.shell: |
    source {{ ansible_user_dir }}/.bashrc.d/aliases.sh
    prj
    cd ansible
    {{ ansible_galaxy_executable }} collection install -r requirements.yml
  register: ansible_galaxy_install_result
  changed_when: "'Nothing to do' not in ansible_galaxy_install_result.stdout"
  when: requirements_yml_stat.stat.exists

- name: Check if requirements.txt exists
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/Prj/ansible/requirements.txt"
  register: requirements_stat

- name: Install ansible pip requirements
  ansible.builtin.pip:
    executable: "{{ ansible_pip_executable }}"
    requirements: "{{ ansible_user_dir }}/Prj/ansible/requirements.txt"
  become: true
  when: requirements_stat.stat.exists

- name: Install molecule via pip
  ansible.builtin.pip:
    name: molecule
    executable: "{{ ansible_pip_executable }}"
    state: present
  become: true
  when: install_molecule_via_pip | bool

- name: Check if ansible vault file exists
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/.ansible_vault.yml"
  register: ansible_vault_stat

- name: Deploy ansible vault file
  ansible.builtin.copy:
    dest: "{{ ansible_user_dir }}/.ansible_vault.yml"
    content: |
      # ansible_role_id and ansible_secret_id are for production use
      ansible_role_id:
      # vault write -force auth/approle/role/ansible/secret-id
      # ansible_secret_id:

      # Use your personal access token from vault for retrieving credentials
      vault_pat:

      # Override the default ansible_user
      # ansible_user:
    mode: "0600"
  when: not ansible_vault_stat.stat.exists

# Both vault password GPG scripts below need gpg before any key is configured
- name: Install GPG packages
  ansible.builtin.include_role:
    name: deamen.gpg.install_gpg
    apply:
      become: true

# setup_ansible_vault_gpg.py uses "#!/usr/bin/env python", the only python shebang ansible-test sanity allows;
# minimal Fedora images do not provide an unversioned python
- name: Install unversioned python command
  ansible.builtin.package:
    name: "{{ unversioned_python_packages }}"
    state: present
  become: true

# ansible_vault_pass_gpg.sh is referenced by ANSIBLE_VAULT_PASSWORD_FILE in ~/.bashrc.d/aliases.sh (deamen.general.config_dev_runtime_env)
# setup_ansible_vault_gpg.py creates the ~/.ansible_vault_pass.gpg it decrypts
# gpg_cat.sh is the generic variant taking the file from --gpg_file or GPG_FILE
- name: Install vault password GPG scripts
  ansible.builtin.copy:
    dest: "/usr/local/bin/{{ item }}"
    src: "{{ item }}"
    mode: "0755"
  loop:
    - ansible_vault_pass_gpg.sh
    - gpg_cat.sh
    - setup_ansible_vault_gpg.py
  become: true
