---
- name: Verify native inventory sources
  hosts: containers
  gather_facts: true
  tasks:
    - name: Validate ansible is installed
      ansible.builtin.assert:
        that:
          - ansible_version.full is version('2.9', '>=')
        fail_msg: "Ansible is not installed or the version is too old"

    # Workaround for error below
    # Python 3.14 requires ansible-core version >= 2.20.0, and we found 2.18.12.
    - name: Check that `molecule` exists in the PATH
      ansible.builtin.command: which molecule
      register: molecule_path
      failed_when: molecule_path.rc != 0
      changed_when: false
      when: ansible_user_id == 'root'

    - name: Check that `molecule` CLI is installed
      ansible.builtin.command: molecule --version
      register: molecule_cli
      failed_when: molecule_cli.rc != 0
      changed_when: false
      when: ansible_user_id != 'root'

    - name: Check that `antsibull-changelog` CLI is installed
      ansible.builtin.command: antsibull-changelog --version
      register: antsibull_changelog_cli
      failed_when: antsibull_changelog_cli.rc != 0
      changed_when: false

    - name: Read deployed aliases.sh
      ansible.builtin.slurp:
        src: "{{ ansible_env.HOME }}/.bashrc.d/aliases.sh"
      register: aliases_sh

    - name: Check that aliases.sh defines unlock_gpg
      ansible.builtin.assert:
        that:
          - "'unlock_gpg()' in (aliases_sh.content | b64decode)"
        fail_msg: "unlock_gpg is missing from ~/.bashrc.d/aliases.sh"

    - name: Check that aliases.sh sources cleanly in a non-tty shell
      ansible.builtin.command: bash -c 'source ~/.bashrc.d/aliases.sh && type unlock_gpg'
      register: unlock_gpg_type
      failed_when: unlock_gpg_type.rc != 0 or 'not a tty' in unlock_gpg_type.stderr
      changed_when: false
