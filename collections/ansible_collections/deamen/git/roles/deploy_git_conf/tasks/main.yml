---
# tasks file for deploy_git_conf
# A .gitconfig left behind by an earlier run as root stays root-owned, because
# git only rewrites the file when a value changes. Hand it back to the user.
- name: Check for an existing .gitconfig
  ansible.builtin.stat:
    path: /home/{{ git_data.user }}/.gitconfig
  register: _deploy_git_conf_gitconfig

- name: Ensure existing .gitconfig is owned by the user
  ansible.builtin.file:
    group: '{{ git_data.user }}'
    owner: '{{ git_data.user }}'
    path: /home/{{ git_data.user }}/.gitconfig
  become: true
  when: _deploy_git_conf_gitconfig.stat.exists

# Run as the user so a newly created .gitconfig is owned by them, not by
# whoever the play becomes (often root).
- name: Configure git as the user
  become: true
  become_method: ansible.builtin.sudo
  become_user: '{{ git_data.user }}'
  block:
    - name: Set Git user email
      community.general.git_config:
        scope: file
        file: "/home/{{ git_data.user }}/.gitconfig"
        name: user.email
        value: "{{ git_data.email }}"

    - name: Set Git user name
      community.general.git_config:
        scope: file
        file: "/home/{{ git_data.user }}/.gitconfig"
        name: user.name
        value: "{{ git_data.username }}"

    - name: Set Git signing key
      community.general.git_config:
        scope: file
        file: "/home/{{ git_data.user }}/.gitconfig"
        name: user.signingkey
        value: "{{ git_data.signing_key }}"

    - name: Disable autocrlf
      community.general.git_config:
        scope: file
        file: "/home/{{ git_data.user }}/.gitconfig"
        name: core.autocrlf
        value: 'false'

    - name: Set git alias hist
      community.general.git_config:
        scope: file
        file: "/home/{{ git_data.user }}/.gitconfig"
        name: alias.hist
        value: 'log --pretty=format:"%h %ad | %s%d [%an]" --graph --date=short'

    - name: Set git alias rpull
      community.general.git_config:
        scope: file
        file: "/home/{{ git_data.user }}/.gitconfig"
        name: alias.rpull
        value: "pull --rebase"

    - name: Set default push behavior
      community.general.git_config:
        scope: file
        file: "/home/{{ git_data.user }}/.gitconfig"
        name: push.default
        value: simple

    - name: Set merge driver to true
      community.general.git_config:
        scope: file
        file: "/home/{{ git_data.user }}/.gitconfig"
        name: merge.ours.driver
        value: 'true'

    - name: Set LFS filter clean
      community.general.git_config:
        scope: file
        file: "/home/{{ git_data.user }}/.gitconfig"
        name: filter.lfs.clean
        value: "git-lfs clean -- %f"

    - name: Set LFS filter smudge
      community.general.git_config:
        scope: file
        file: "/home/{{ git_data.user }}/.gitconfig"
        name: filter.lfs.smudge
        value: "git-lfs smudge -- %f"

    - name: Set LFS filter process
      community.general.git_config:
        scope: file
        file: "/home/{{ git_data.user }}/.gitconfig"
        name: filter.lfs.process
        value: "git-lfs filter-process"

    - name: Require LFS filter
      community.general.git_config:
        scope: file
        file: "/home/{{ git_data.user }}/.gitconfig"
        name: filter.lfs.required
        value: 'true'

    - name: Set diff tool to meld
      community.general.git_config:
        scope: file
        file: "/home/{{ git_data.user }}/.gitconfig"
        name: diff.tool
        value: meld

    - name: Disable difftool prompt
      community.general.git_config:
        scope: file
        file: "/home/{{ git_data.user }}/.gitconfig"
        name: difftool.prompt
        value: 'false'

    - name: Set meld command for difftool
      community.general.git_config:
        scope: file
        file: "/home/{{ git_data.user }}/.gitconfig"
        name: 'difftool."meld".cmd'
        value: 'meld "$LOCAL" "$REMOTE"'

    - name: Enable GPG sign by default
      community.general.git_config:
        scope: file
        file: "/home/{{ git_data.user }}/.gitconfig"
        name: commit.gpgsign
        value: 'true'

    - name: Mark /github/workspace as safe directory
      community.general.git_config:
        scope: file
        file: "/home/{{ git_data.user }}/.gitconfig"
        name: safe.directory
        value: /github/workspace

    # The old gopass setup pinned a username for https://github.com/, which
    # makes gh's helper refuse to answer. Remove it.
    - name: Remove legacy GitHub credential settings
      community.general.git_config:
        scope: file
        file: "/home/{{ git_data.user }}/.gitconfig"
        name: "credential.https://github.com/.{{ item }}"
        state: absent
      loop:
        - username
        - helper

    # Git runs every matching helper in order, so the helpers inherited from
    # /etc/gitconfig or the generic [credential] section (for example the
    # VS Code dev container helper) answer before gh. An empty helper entry
    # clears that list, leaving gh as the only helper for GitHub.
    - name: Read GitHub credential helpers
      ansible.builtin.command:
        argv:
          - git
          - config
          - --file
          - "/home/{{ git_data.user }}/.gitconfig"
          - --get-all
          - "credential.{{ item }}.helper"
      loop: "{{ _deploy_git_conf_gh_hosts }}"
      register: _deploy_git_conf_gh_helpers
      changed_when: false
      failed_when: _deploy_git_conf_gh_helpers.rc > 1

    - name: Make gh the only GitHub credential helper
      # git_config refuses an empty value, which the reset entry needs.
      ansible.builtin.shell:  # noqa: command-instead-of-module
        cmd: >-
          git config --file "$CONF" --replace-all "$KEY" '' &&
          git config --file "$CONF" --add "$KEY" "$HELPER"
      environment:
        CONF: "/home/{{ git_data.user }}/.gitconfig"
        KEY: "credential.{{ item.item }}.helper"
        HELPER: "{{ _deploy_git_conf_gh_helper }}"
      loop: "{{ _deploy_git_conf_gh_helpers.results }}"
      loop_control:
        label: "{{ item.item }}"
      changed_when: true
      when: item.stdout_lines != ['', _deploy_git_conf_gh_helper]
