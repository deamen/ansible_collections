---
bugfixes:
  - deploy_git_conf - make ``gh auth git-credential`` the only credential helper for ``https://github.com`` and ``https://gist.github.com``, so inherited helpers (such as the VS Code dev container helper) no longer answer first, and remove the legacy ``credential.https://github.com/.username`` and gopass helper settings that made ``gh`` refuse to supply a token.
removed_features:
  - deploy_git_conf - the ``git_data.github_username`` and ``git_data.github_helper`` options were removed; GitHub credentials now always come from the GitHub CLI.
