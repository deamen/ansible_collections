---
# handlers file for config_gpg
- name: Remove private GPG key file
  ansible.builtin.file:
    path: '{{ config_gpg_secret_key_path }}'
    state: absent
  become: true
  become_method: ansible.builtin.sudo
  become_user: '{{ config_gpg_user }}'

- name: Remove ownertrust file
  ansible.builtin.file:
    path: '/home/{{ config_gpg_user }}/.gnupg/owntrust.txt'
    state: absent
  become: true
  become_method: ansible.builtin.sudo
  become_user: '{{ config_gpg_user }}'

# A running agent keeps its old settings until reloaded; with no agent running this is a no-op
- name: Reload gpg-agent
  ansible.builtin.command:
    cmd: gpgconf --reload gpg-agent
  become: true
  become_method: ansible.builtin.sudo
  become_user: '{{ config_gpg_user }}'
  changed_when: true
