---
ancestor: null
releases:
  1.0.0:
    changes:
      release_summary: Initial release of the ``deamen.gpg`` collection.
    objects:
      role:
        - description: Configure GPG.
          name: config_gpg
          namespace: null
        - description: Install GPG packages.
          name: install_gpg
          namespace: null
    release_date: '2026-04-07'
  1.0.1:
    changes:
      bugfixes:
        - config_gpg - make the role idempotent.
      minor_changes:
        - config_gpg - improve the role.
        - generate_gpg_key - improve the role and update role metadata.
        - install_gpg - update role metadata.
    objects:
      role:
        - description: Generate GPG key.
          name: generate_gpg_key
          namespace: null
    release_date: '2026-08-18'
  2.0.0:
    changes:
      breaking_changes:
        - config_gpg - rename ``config_gpg_private_key_path`` to ``config_gpg_secret_key_path``.
        - 'config_gpg - replace ``config_gpg_import_key`` with ``config_gpg_import_secret_key``,
          which defaults to ``false``. Set ``config_gpg_import_secret_key: true``
          to keep importing the private key.'
      minor_changes:
        - config_gpg - add ``config_gpg_import_public_key`` and ``config_gpg_public_key``
          to import a public key without a private key.
      release_summary: Adds public key import to ``config_gpg`` and renames its key
        import variables.
    fragments:
      - config-gpg-public-key-import.yml
      - v2.0.0-summary.yml
    release_date: '2026-11-02'
  2.1.0:
    changes:
      minor_changes:
        - Add ``deamen.gpg.config_gpg`` and ``deamen.gpg.generate_gpg_key`` playbooks
          for configuring GPG on localhost (used by ``setup_ansible_vault_gpg.py``
          from ``deamen.ansible``).
    fragments:
      - add-config-and-generate-key-plays.yml
    release_date: '2026-11-03'
  2.2.0:
    changes:
      minor_changes:
        - Add the ``deamen.gpg.configure_gpg_for_user`` playbook, which installs GPG
          and runs ``config_gpg`` on inventory hosts.
        - The ``deamen.gpg.config_gpg`` and ``deamen.gpg.generate_gpg_key`` playbooks
          now use the role default cache TTLs, so their ``max-cache-ttl`` goes from
          ``36000`` to ``43200``.
        - config_gpg - raise the ``config_gpg_default_cache_ttl`` default from ``60``
          to ``7200`` (2 hours) and the ``config_gpg_max_cache_ttl`` default from
          ``120`` to ``43200`` (12 hours).
        - config_gpg - reload a running ``gpg-agent`` when ``gpg-agent.conf`` changes.
    fragments:
      - configure-gpg-for-user.yml
    release_date: '2026-11-04'
  2.3.0:
    changes:
      minor_changes:
        - config_gpg - ``gpg-agent.conf`` now has ``enable-ssh-support`` only when
          SSH support is on. Previously it was always set, so users without an authentication
          key, or with ``config_gpg_ssh_support`` set to ``false``, no longer get
          it.
        - config_gpg - add ``config_gpg_ssh_support`` (``auto``, ``true`` or ``false``,
          default ``auto``) to use ``gpg-agent`` as the SSH agent (SSH-via-GPG). When
          the secret key has an authentication key, the role adds ``enable-ssh-support``
          to ``gpg-agent.conf``, lists the authentication keygrips in ``~/.gnupg/sshcontrol``
          and deploys ``~/.bashrc.d/gpg-ssh.sh``, which points ``SSH_AUTH_SOCK`` at
          ``gpg-agent``.
    fragments:
      - config-gpg-ssh-support.yml
    release_date: '2026-11-11'
