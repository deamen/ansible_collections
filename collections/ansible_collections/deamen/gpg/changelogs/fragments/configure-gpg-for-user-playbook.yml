---
minor_changes:
  - Add the ``deamen.gpg.configure_gpg_for_user`` playbook, which installs GPG and runs ``config_gpg`` on inventory hosts.
  - config_gpg - raise the ``config_gpg_default_cache_ttl`` default from ``60`` to ``7200`` (2 hours)
    and the ``config_gpg_max_cache_ttl`` default from ``120`` to ``43200`` (12 hours).
  - config_gpg - reload a running ``gpg-agent`` when ``gpg-agent.conf`` changes.
  - The ``deamen.gpg.config_gpg`` and ``deamen.gpg.generate_gpg_key`` playbooks now use the role default cache TTLs,
    so their ``max-cache-ttl`` goes from ``36000`` to ``43200``.
