---
- name: Prepare test containers
  hosts: containers
  become: true
  tasks:
    - name: Configure passwordless sudo for become operations
      ansible.builtin.copy:
        content: 'ALL ALL=(ALL) NOPASSWD: ALL'
        dest: /etc/sudoers.d/molecule
        mode: '0440'
        validate: 'visudo -cf %s'

    - name: Create test user
      ansible.builtin.user:
        name: '{{ config_gpg_user }}'
        state: present
        create_home: true

    - name: Check if GPG key is already imported
      ansible.builtin.command:
        cmd: 'gpg --list-secret-keys --with-colons {{ config_gpg_fingerprint }}'
      become: true
      become_method: ansible.builtin.sudo
      become_user: '{{ config_gpg_user }}'
      changed_when: false
      failed_when: false
      register: _molecule_gpg_key_check
      when: config_gpg_import_secret_key | default(false) | bool

    - name: Copy test GPG private key to container
      ansible.builtin.copy:
        dest: '{{ config_gpg_secret_key_path }}'
        group: '{{ config_gpg_user }}'
        mode: '0600'
        owner: '{{ config_gpg_user }}'
        src: '{{ playbook_dir }}/../config_gpg/test-ed25519-secret.asc'
      when:
        - config_gpg_import_secret_key | default(false) | bool
        - _molecule_gpg_key_check.rc != 0

- name: Test deamen.gpg.configure_gpg_for_user playbook
  ansible.builtin.import_playbook: ../../../playbooks/configure_gpg_for_user.yml
