---
- name: Install GPG, configure gpg-agent and optionally import a GPG key
  hosts: localhost
  become: false
  connection: ansible.builtin.local
  gather_facts: false
  tasks:
    - name: Install GPG packages
      ansible.builtin.import_role:
        name: deamen.gpg.install_gpg
      become: true

    - name: Configure GPG
      ansible.builtin.import_role:
        name: deamen.gpg.config_gpg
      vars:
        config_gpg_default_cache_ttl: 7200
        config_gpg_max_cache_ttl: 36000
