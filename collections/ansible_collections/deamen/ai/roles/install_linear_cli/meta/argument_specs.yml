---
argument_specs:
  main:
    short_description: Install linear-cli, the command-line interface for Linear.
    description:
      - >-
        Run the C(linear-installer.sh) published with the release, which verifies the tarball checksum
        and installs the C(linear) binary without editing C(PATH).
      - The download is skipped when the installed binary already reports O(linear_cli_version).
      - >-
        Copy the linear-cli skill from the source archive of O(linear_cli_version) into
        C(~/.claude/skills/linear-cli) of the connecting user, and remove the C(install-linear-cli-skill) script
        that earlier releases deployed.
    version_added: 2.0.0
    author:
      - Song Tang <stang@mmz.au>
    options:
      linear_cli_version:
        description: Release tag to install from U(https://github.com/schpet/linear-cli/releases).
        type: str
        default: v3.1.0
      linear_cli_install_dir:
        description: Directory the C(linear) binary is installed into.
        type: path
        default: /usr/local/bin
      linear_cli_claude_code_skill:
        description:
          - >-
            Copy C(skills/linear-cli) from the source archive of O(linear_cli_version) into
            C(~/.claude/skills/linear-cli) of the connecting user, so Claude Code loads it as a personal skill.
          - The copy is skipped when C(~/.claude/skills/linear-cli/.linear-cli-version) already holds O(linear_cli_version).
        type: bool
        default: true
        version_added: 2.2.0
