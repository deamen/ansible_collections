---
# tasks file for install_linear_cli

- name: Check that linear-cli is published for this architecture
  ansible.builtin.assert:
    that: ansible_facts['architecture'] in __linear_cli_supported_archs
    fail_msg: "linear-cli is not available for {{ ansible_facts['architecture'] }}"
    quiet: true

- name: Get the installed linear-cli version
  ansible.builtin.command: "{{ linear_cli_install_dir }}/linear --version"
  register: __linear_cli_installed
  changed_when: false
  failed_when: false

- name: Install linear-cli {{ linear_cli_version }}
  # --version prints e.g. "linear 3.1.0", while release tags carry a leading "v"
  when: >-
    __linear_cli_installed.rc != 0 or
    (linear_cli_version | regex_replace('^v', '')) not in __linear_cli_installed.stdout
  block:
    - name: Install packages needed by the installer
      ansible.builtin.package:
        name: "{{ __linear_cli_dependency_packages }}"
        state: present
      become: true

    - name: Create a temporary download directory
      ansible.builtin.tempfile:
        state: directory
        suffix: linear-cli
      register: __linear_cli_tmp

    - name: Download the linear-cli installer
      ansible.builtin.get_url:
        url: "{{ __linear_cli_installer_url }}"
        dest: "{{ __linear_cli_tmp.path }}/linear-installer.sh"
        mode: "0755"

    - name: Run the linear-cli installer
      # LINEAR_UNMANAGED_INSTALL installs the binary straight into the directory,
      # without editing PATH/shell rc files or installing the self-updater
      ansible.builtin.command:
        cmd: "{{ __linear_cli_tmp.path }}/linear-installer.sh --quiet"
      environment:
        LINEAR_UNMANAGED_INSTALL: "{{ linear_cli_install_dir }}"
      changed_when: true
      become: true

  always:
    - name: Remove the temporary download directory
      ansible.builtin.file:
        path: "{{ __linear_cli_tmp.path }}"
        state: absent
      when: __linear_cli_tmp.path is defined


- name: Remove the npx-based linear-cli skill installer
  # Deployed by earlier releases; the skill is now copied in by this role
  ansible.builtin.file:
    path: "{{ linear_cli_install_dir }}/{{ __linear_cli_skills_installer_name }}"
    state: absent
  become: true

- name: Install the linear-cli skill into Claude Code
  # Runs as the connecting user, whose ~/.claude/skills holds personal skills
  when: linear_cli_claude_code_skill | bool
  block:
    - name: Read the installed linear-cli skill version
      ansible.builtin.slurp:
        src: "{{ __linear_cli_skill_version_file }}"
      register: __linear_cli_skill_installed
      failed_when: false

    - name: Install linear-cli skill {{ linear_cli_version }}
      # A missing version file reads as an empty string, which never matches a release tag
      when: >-
        (__linear_cli_skill_installed.content | default('') | b64decode | trim)
        != linear_cli_version
      block:
        - name: Install packages needed to unpack the source archive
          ansible.builtin.package:
            name: "{{ __linear_cli_skill_packages }}"
            state: present
          become: true

        - name: Create a temporary download directory for the skill
          ansible.builtin.tempfile:
            state: directory
            suffix: linear-cli-skill
          register: __linear_cli_skill_tmp

        - name: Unpack the linear-cli source archive of the release
          # The skill is taken from the same tag as the binary, so it describes the installed version
          ansible.builtin.unarchive:
            src: "{{ __linear_cli_skill_archive_url }}"
            dest: "{{ __linear_cli_skill_tmp.path }}"
            remote_src: true

        - name: Remove the previous linear-cli skill
          # Files dropped by the new release must not linger
          ansible.builtin.file:
            path: "{{ __linear_cli_skill_dir }}"
            state: absent

        - name: Create the linear-cli skill directory
          ansible.builtin.file:
            path: "{{ __linear_cli_skill_dir }}"
            state: directory
            mode: "0755"

        - name: Copy the linear-cli skill
          ansible.builtin.copy:
            src: "{{ __linear_cli_skill_tmp.path }}/{{ __linear_cli_skill_archive_path }}/"
            dest: "{{ __linear_cli_skill_dir }}"
            mode: u=rwX,g=rX,o=rX
            remote_src: true

        - name: Remove the skill template
          # Older releases ship the generator's input next to SKILL.md; agents only need SKILL.md
          ansible.builtin.file:
            path: "{{ __linear_cli_skill_dir }}/SKILL.template.md"
            state: absent

        - name: Record the installed linear-cli skill version
          ansible.builtin.copy:
            content: "{{ linear_cli_version }}\n"
            dest: "{{ __linear_cli_skill_version_file }}"
            mode: "0644"

      always:
        - name: Remove the temporary skill download directory
          ansible.builtin.file:
            path: "{{ __linear_cli_skill_tmp.path }}"
            state: absent
          when: __linear_cli_skill_tmp.path is defined
