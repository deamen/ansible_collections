---
# vars file for install_linear_cli

# Release architectures published by linear-cli, keyed by ansible_facts['architecture']
__linear_cli_supported_archs:
  - x86_64
  - aarch64
# The installer is pinned to its release and embeds the sha256 of each tarball
__linear_cli_installer_url: "https://github.com/schpet/linear-cli/releases/download/{{ linear_cli_version }}/linear-installer.sh"
# The installer needs tar and xz to unpack the .tar.xz release archive
__linear_cli_dependency_packages:
  - tar
  - xz
# The skill is copied from the source archive of the release tag
__linear_cli_skill_archive_url: "https://github.com/schpet/linear-cli/archive/refs/tags/{{ linear_cli_version }}.tar.gz"
# GitHub names the archive's top directory after the tag without its leading "v"
__linear_cli_skill_archive_path: "linear-cli-{{ linear_cli_version | regex_replace('^v', '') }}/skills/linear-cli"
__linear_cli_skill_dir: "{{ ansible_facts['user_dir'] }}/.claude/skills/linear-cli"
# unarchive needs tar and gzip for the .tar.gz source archive
__linear_cli_skill_packages:
  - gzip
  - tar
__linear_cli_skill_version_file: "{{ __linear_cli_skill_dir }}/.linear-cli-version"
# Deployed by earlier releases and removed by this one
__linear_cli_skills_installer_name: install-linear-cli-skill
