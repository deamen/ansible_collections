---
- name: Verify deamen.ai.install_linear_cli
  hosts: molecule:&containers
  gather_facts: false

  vars:
    expected_version: "{{ linear_cli_version | default('v3.1.0') | regex_replace('^v', '') }}"

  tasks:
    - name: Get the linear binary status
      ansible.builtin.stat:
        path: /usr/local/bin/linear
      register: linear_binary

    - name: Check the linear binary is installed and executable
      ansible.builtin.assert:
        that:
          - linear_binary.stat.exists
          - linear_binary.stat.mode == '0755'
        fail_msg: "/usr/local/bin/linear is missing or has the wrong mode"

    - name: Check linear-cli version
      ansible.builtin.command: linear --version
      register: linear_version_result
      changed_when: false

    - name: Check the expected linear-cli version is installed
      ansible.builtin.assert:
        that:
          - expected_version in linear_version_result.stdout
        fail_msg: "Expected linear {{ expected_version }}, got: {{ linear_version_result.stdout }}"

    - name: Get the installer env script status
      ansible.builtin.stat:
        path: /usr/local/bin/env
      register: linear_env_script

    - name: Check the installer did not write an env script next to the binary
      ansible.builtin.assert:
        that:
          - not linear_env_script.stat.exists
        fail_msg: "The installer wrote /usr/local/bin/env; LINEAR_UNMANAGED_INSTALL was not honoured"

    - name: Get the skill installer status
      ansible.builtin.stat:
        path: /usr/local/bin/install-linear-cli-skill
      register: linear_skill_installer

    - name: Check the npx-based skill installer is removed
      ansible.builtin.assert:
        that:
          - not linear_skill_installer.stat.exists
        fail_msg: "/usr/local/bin/install-linear-cli-skill from an earlier release was not removed"

    - name: Read the linear-cli skill
      ansible.builtin.slurp:
        src: /root/.claude/skills/linear-cli/SKILL.md
      register: linear_skill

    - name: Check the linear-cli skill is installed for Claude Code
      ansible.builtin.assert:
        that:
          - "'name: linear-cli' in (linear_skill.content | b64decode)"
        fail_msg: "/root/.claude/skills/linear-cli/SKILL.md is not the linear-cli skill"

    - name: Read the installed skill version
      ansible.builtin.slurp:
        src: /root/.claude/skills/linear-cli/.linear-cli-version
      register: linear_skill_version

    - name: Check the skill comes from the installed release
      ansible.builtin.assert:
        that:
          - (linear_skill_version.content | b64decode | trim) == 'v' ~ expected_version
        fail_msg: "Expected skill v{{ expected_version }}, got: {{ linear_skill_version.content | b64decode }}"

    - name: Get the skill template status
      ansible.builtin.stat:
        path: /root/.claude/skills/linear-cli/SKILL.template.md
      register: linear_skill_template

    - name: Check the skill template is not installed
      ansible.builtin.assert:
        that:
          - not linear_skill_template.stat.exists
        fail_msg: "/root/.claude/skills/linear-cli/SKILL.template.md should have been removed"
