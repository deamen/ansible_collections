---
- name: Build llama.cpp and OpenBLAS using Buildah on Fedora
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars:
    # Defaults to build_outputs/llama.cpp/fedora under the directory the playbook is run from
    llamacpp_output_dir: "{{ lookup('env', 'PWD') }}/build_outputs/llama.cpp/fedora"
    arch: "amd64"
    base_image: "registry.fedoraproject.org/fedora:latest"
    build_packages:
      - git
      - gcc
      - gcc-c++
      - gcc-gfortran
      - cmake
      - ninja-build
      - make
      - openssl-devel
      - kernel-headers

  tasks:
    - name: Start Buildah working container
      ansible.builtin.command: buildah from --arch {{ arch }} {{ base_image }}
      register: from_out
      changed_when: true

    - name: Set container_id fact
      ansible.builtin.set_fact:
        container_id: "{{ from_out.stdout | trim }}"

    - name: Add working container as dynamic host (Buildah connection)
      ansible.builtin.add_host:
        name: "buildcntr_{{ container_id }}"
        ansible_connection: containers.podman.buildah
        ansible_host: "{{ container_id }}"

    - name: Build llama.cpp
      delegate_to: "buildcntr_{{ container_id }}"
      become: true
      block:
        - name: Install python3-libdnf5 package
          # Using raw module because the ansible.builtin.dnf module itself depends on python3-libdnf5
          # This creates a chicken-and-egg problem where we need to install this package first
          # before we can use the dnf module for other package management tasks
          ansible.builtin.raw: microdnf install -y python3-libdnf5
          changed_when: result.rc != 0
          register: result

        - name: Install build dependencies
          ansible.builtin.dnf:
            name: "{{ build_packages }}"
            state: present
            install_weak_deps: false

        - name: Clone OpenBLAS
          ansible.builtin.git:
            repo: https://github.com/OpenMathLib/OpenBLAS.git
            dest: /OpenBLAS
            version: develop
            depth: 1

        - name: Build OpenBLAS (install to /blas)
          ansible.builtin.shell: |
            mkdir -p /OpenBLAS/build
            cd /OpenBLAS/build
            cmake .. \
              -DUSE_OPENMP=1 \
              -DTARGET=SKYLAKEX \
              -DBUILD_SHARED_LIBS=OFF \
              -DBUILD_STATIC_LIBS=ON
            cmake --build . -j$(nproc --ignore=1)
            cmake --install . --prefix /blas
          args:
            creates: /blas/lib/libopenblas.a

        - name: Clone llama.cpp
          ansible.builtin.git:
            repo: https://github.com/ggml-org/llama.cpp.git
            dest: /llama_src
            version: master
            depth: 1

        - name: Build llama.cpp (install to /llama)
          ansible.builtin.shell: |
            mkdir -p /llama_src/build
            cd /llama_src/build
            cmake .. -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DGGML_BLAS=ON \
              -DGGML_BLAS_VENDOR=OpenBLAS \
              -DBUILD_SHARED_LIBS=OFF \
              -DBLAS_LIBRARIES=/blas/lib64/libopenblas.a \
              -DBLAS_INCLUDE_DIRS=/blas/include/openblas \
              -DCMAKE_C_FLAGS="-march=cascadelake" \
              -DCMAKE_CXX_FLAGS="-march=cascadelake" \
              -DGGML_NATIVE=OFF
            cmake --build . -j$(nproc --ignore=1)
            cmake --install . --prefix /llama
          args:
            creates: /llama

    - name: Ensure local output directory exists
      ansible.builtin.file:
        path: "{{ llamacpp_output_dir }}"
        state: directory
        mode: '0755'

    - name: Copy llama executables out of the working container
      ansible.builtin.command:
        argv:
          - buildah
          - unshare
          - --
          - sh
          - -c
          - mnt=$(buildah mount "$1") && cp -a "$mnt/llama/bin" "$2/"; rc=$?; buildah umount "$1"; exit $rc
          - sh
          - "{{ container_id }}"
          - "{{ llamacpp_output_dir }}"
      changed_when: true

    - name: Remove working container
      ansible.builtin.command: buildah rm {{ container_id }}
      changed_when: true
