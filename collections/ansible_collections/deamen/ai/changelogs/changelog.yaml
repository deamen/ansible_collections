---
ancestor: null
releases:
  1.0.0:
    changes:
      minor_changes:
        - Add ``buildah_fedora-llamacpp.yml`` playbook.
      release_summary: Initial release of the ``deamen.ai`` collection.
    objects:
      role:
        - description: Install gemini-cli, the command-line interface for Gemini.
          name: install_gemini_cli
          namespace: null
        - description: Install Node.js and npm packages.
          name: install_npm
          namespace: null
    release_date: '2026-06-05'
  1.0.1:
    objects:
      role:
        - description: Install pi-coding-agent globally with npm.
          name: install_pi_code
          namespace: null
    release_date: '2026-07-21'
  2.0.0:
    changes:
      breaking_changes:
        - Rename ``buildah_fedora-llamacpp.yml`` playbook to ``buildah_fedora_llamacpp.yml``
          so it can be run by its FQCN ``deamen.ai.buildah_fedora_llamacpp``; it now
          writes the llama.cpp executables to ``build_outputs/llama.cpp/fedora`` under
          the current directory instead of ``../out/llama`` relative to the playbook
          (override with ``llamacpp_output_dir``).
      minor_changes:
        - Add ``buildah_alpine_llamacpp.yml`` playbook to build statically linked
          ``llama-cli`` and ``llama-server`` with OpenBLAS on Alpine Linux.
        - Add ``install_linear_cli.yml`` playbook to install linear-cli with the new
          ``install_linear_cli`` role.
    fragments:
      - add-install-linear-cli.yml
      - rename-llamacpp-builds.yml
    objects:
      role:
        - description: Install linear\-cli, the command\-line interface for Linear.
          name: install_linear_cli
          namespace: null
    release_date: '2026-11-03'
  2.1.0:
    changes:
      minor_changes:
        - Add the ``install_claude_code`` role to install the Claude Code CLI for
          a user with the native installer.
    fragments:
      - install-claude-code.yml
    objects:
      role:
        - description: Install the Claude Code CLI for a user with the native installer.
          name: install_claude_code
          namespace: null
    release_date: '2026-11-05'
  2.2.0:
    changes:
      minor_changes:
        - install_linear_cli - deploy ``install-linear-cli-skill`` into ``linear_cli_install_dir``,
          which installs the skill for other AI agents on demand with ``npx skills
          add`` (``linear_cli_skills_installer``).
        - install_linear_cli - install the linear-cli skill into Claude Code for the
          connecting user when Claude Code is installed (``linear_cli_claude_code_skill``).
    fragments:
      - install-linear-cli-skill.yml
    release_date: '2026-11-07'
  2.3.0:
    changes:
      minor_changes:
        - install_linear_cli - the playbook now targets ``all`` instead of ``all:!localhost``
          so it can run against localhost, which the ``buildah_fedora-codespace``
          image build needs (https://github.com/deamen/ansible_collections/pull/112).
    fragments:
      - MMZ-22-install-linear-cli-localhost.yml
    release_date: '2026-11-09'
