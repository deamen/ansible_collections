---
ancestor: null
releases:
  1.0.0:
    changes:
      minor_changes:
        - config_dev_runtime_env - install pre-commit and detect-secrets.
      release_summary: Initial release of the ``deamen.general`` collection.
    modules:
      - description: Check if running inside a container (Docker, Podman, etc.)
        name: check_is_container
        namespace: ''
    objects:
      role:
        - description: Configures the runtime environment for development.
          name: config_dev_runtime_env
          namespace: null
        - description: Install general development packages.
          name: install_dev_packages
          namespace: null
    release_date: '2026-04-04'
  1.0.1:
    changes:
      bugfixes:
        - config_dev_runtime_env - fix git prompt formatting.
    release_date: '2026-04-04'
  1.0.2:
    objects:
      role:
        - description: Deploy Microsoft Copilot CLI installation script to target
            hosts and execute it.
          name: install_copilot_cli
          namespace: null
    release_date: '2026-04-05'
  1.0.3:
    changes:
      bugfixes:
        - Fix playbook relative path in molecule scenarios.
        - config_dev_runtime_env - add shell type directive for shellcheck to sourced
          scripts.
        - config_dev_runtime_env - look up ``git-prompt.sh`` under ``/usr/share/git-core``
          on Fedora/RHEL and Alpine.
        - install_copilot_cli - check both root and non-root copilot binary locations.
      minor_changes:
        - Move molecule scenarios under ``extensions/``.
        - install_dev_packages - add ``tmux`` to ``essential_packages``.
    release_date: '2026-11-01'
  1.0.4:
    changes:
      minor_changes:
        - install_dev_packages - add ``gzip``, ``which`` and ``procps-ng`` to ``essential_packages``
          (needed by VS Code server in minimal containers).
        - install_dev_packages - install all packages in one transaction.
    release_date: '2026-11-01'
  1.0.5:
    changes:
      minor_changes:
        - config_dev_runtime_env - define ``ansiblev`` and ``ansible-playbookv`` as
          bash functions instead of aliases wrapping functions.
        - config_dev_runtime_env - use ``ANSIBLE_VAULT_PASSWORD_FILE`` when ``~/.ansible_vault_pass.gpg``
          and the gpg helper script exist, and only pass ``--ask-vault-pass`` when
          no vault password file is configured.
    fragments:
      - config_dev_runtime_env-aliases.yml
    release_date: '2026-11-03'
  1.1.0:
    changes:
      minor_changes:
        - config_dev_runtime_env - add ``config_dev_runtime_env_force_deploy_aliases``
          to redeploy ``aliases.sh`` when it already exists.
        - config_dev_runtime_env - add ``unlock_gpg`` to ``aliases.sh`` to cache the
          GPG signing and decryption passphrases in ``gpg-agent``, and export ``GPG_TTY``
          in interactive shells.
    fragments:
      - unlock-gpg-alias.yml
    release_date: '2026-11-05'
  1.2.0:
    changes:
      minor_changes:
        - Add the ``install_himalaya`` role to install the himalaya email CLI for
          the connecting user and deploy a minimal configuration.
    fragments:
      - install-himalaya.yml
    objects:
      role:
        - description: Install the himalaya email CLI for the connecting user.
          name: install_himalaya
          namespace: null
    release_date: '2026-11-06'
  1.3.0:
    changes:
      minor_changes:
        - Add the ``configure_keyring`` role to install a GNOME Keyring Secret Service
          that a user unlocks on demand with ``keyring-unlock``, for containers and
          headless hosts.
    fragments:
      - configure-keyring.yml
    objects:
      role:
        - description: Install a GNOME Keyring Secret Service that a user unlocks
            on demand.
          name: configure_keyring
          namespace: null
    release_date: '2026-11-07'
