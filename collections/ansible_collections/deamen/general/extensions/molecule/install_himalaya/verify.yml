---
- name: Verify deamen.general.install_himalaya
  hosts: molecule:&containers
  gather_facts: true

  vars:
    home: "{{ ansible_facts['env']['HOME'] }}"

  tasks:
    - name: Get the installer script
      ansible.builtin.stat:
        path: "{{ home }}/.local/bin/install_himalaya.sh"
      register: installer

    - name: Check the installer script
      ansible.builtin.assert:
        that:
          - installer.stat.exists
          - installer.stat.mode == '0755'
        quiet: true

    - name: Get the himalaya version
      ansible.builtin.command: "{{ home }}/.local/bin/himalaya --version"
      register: himalaya_version
      changed_when: false

    - name: Check the himalaya version
      ansible.builtin.assert:
        that: himalaya_version.stdout is match('^himalaya')
        fail_msg: "Unexpected himalaya --version output: {{ himalaya_version.stdout }}"
        quiet: true

    - name: Get the himalaya configuration
      ansible.builtin.stat:
        path: "{{ home }}/.config/himalaya/config.toml"
      register: config_stat

    - name: Read the himalaya configuration
      ansible.builtin.slurp:
        src: "{{ home }}/.config/himalaya/config.toml"
      register: config_file

    - name: Check the himalaya configuration
      vars:
        config: "{{ config_file.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - config_stat.stat.mode == '0600'
          - "'[accounts.\"selfhosted\"]' in config"
          - "'email = \"test@example.org\"' in config"
          - "'imap.server = \"imap://mail.example.org:143\"' in config"
          - "'imap.starttls = true' in config"
          - "'imap.sasl.plain.username = \"test@example.org\"' in config"
          - >-
            ('imap.sasl.plain.password.command = "/usr/local/bin/gpg_cat.sh --gpg_file '
            ~ home ~ '/.config/himalaya/selfhosted.gpg"') in config
          - "'mailbox.alias.inbox = \"INBOX\"' in config"
        quiet: true

    - name: Check that himalaya parses the configuration
      # Listing folders needs the IMAP server, but an invalid config.toml fails before connecting
      ansible.builtin.command: "{{ home }}/.local/bin/himalaya account list"
      register: account_list
      changed_when: false

    - name: Check that the account is listed
      ansible.builtin.assert:
        that: "'selfhosted' in account_list.stdout"
        quiet: true
