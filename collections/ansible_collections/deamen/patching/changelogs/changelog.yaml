---
ancestor: null
releases:
  1.0.0:
    changes:
      release_summary: Initial release of the ``deamen.patching`` collection.
    fragments:
      - 1.0.0.yml
      - patching-fleet-report.yml
      - patching-profiles.yml
      - patching-report-only-and-skip.yml
    objects:
      role:
        - description: Apply OS updates to RHEL and Fedora hosts in fixed phases.
          name: install_system_updates
          namespace: null
        - description: Aggregate the per\-host patching summaries of a run into a
            fleet report.
          name: patching_fleet_report
          namespace: null
        - description: Starter patching profile showing the profile contract.
          name: patching_profile_example
          namespace: null
    release_date: '2026-11-10'
  1.1.0:
    changes:
      minor_changes:
        - install_system_updates - add ``patching_update_timeout`` (default ``3600``
          seconds), which fails the download or install step when it hangs, for example
          on a stalled mirror. The failure is handled like any other update failure.
          ``needs-restarting -r`` now fails after 300 seconds.
    fragments:
      - update-timeouts.yml
    release_date: '2026-11-11'
