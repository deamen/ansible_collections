---
- name: Test that a failed preflight stops the run before any change
  hosts: containers
  gather_facts: false
  become: true
  tasks:
    - name: Run the role with an impossible free space requirement
      block:
        - name: Install system updates
          ansible.builtin.include_role:
            name: deamen.patching.install_system_updates
          vars:
            patching_pre_update_hooks:
              - "{{ playbook_dir }}/hooks/pre_update.yml"
            patching_preflight_min_free_mb:
              /: 1000000000

        - name: Fail when the role did not fail
          ansible.builtin.fail:
            msg: The role should have failed in preflight

      rescue:
        - name: Assert the role failed in preflight
          ansible.builtin.assert:
            that:
              - patching_summary.status == 'failed'
              - patching_summary.failed_step == 'preflight'
              - not patching_summary.update_failed
            fail_msg: "Unexpected summary: {{ patching_summary | default('not set') }}"
