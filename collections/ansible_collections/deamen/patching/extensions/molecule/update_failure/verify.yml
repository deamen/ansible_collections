---
- name: Verify the cleanup ran after the failed update
  hosts: containers
  gather_facts: false
  tasks:
    - name: Read the extension log
      ansible.builtin.slurp:
        src: /tmp/patching_hooks.log
      register: extension_log

    # post_reboot runs as cleanup without a reboot; test_profile has no post_update.yml
    - name: Assert the profile and hook cleanup ran with patching_update_failed set
      ansible.builtin.assert:
        that:
          - >-
            (extension_log.content | b64decode).splitlines() == [
              'test_profile excludes',
              'test_profile pre_update',
              'test_profile post_reboot update_failed=True',
              'hook post_reboot update_failed=True'
            ]
        fail_msg: "Unexpected extension log: {{ (extension_log.content | b64decode).splitlines() }}"

    - name: Look for the repository that cannot be loaded
      ansible.builtin.stat:
        path: /etc/yum.repos.d/patching-broken.repo
      register: broken_repo

    - name: Assert the post_reboot hook removed the repository
      ansible.builtin.assert:
        that:
          - not broken_repo.stat.exists
