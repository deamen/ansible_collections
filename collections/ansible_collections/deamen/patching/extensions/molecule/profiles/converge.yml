---
- name: Test profiles with deamen.patching.install_system_updates
  hosts: containers
  gather_facts: false
  become: true
  tasks:
    - name: Install system updates with a test profile and hooks
      ansible.builtin.include_role:
        name: deamen.patching.install_system_updates
      vars:
        # The profile adds the second glob too, to check the merged list has no duplicates
        patching_exclude_packages:
          - another-nonexistent-package*
          - nonexistent-test-package*
        patching_post_reboot_hooks:
          - "{{ playbook_dir }}/hooks/post_reboot.yml"
        patching_post_update_hooks:
          - "{{ playbook_dir }}/hooks/post_update.yml"
        patching_pre_update_hooks:
          - "{{ playbook_dir }}/hooks/pre_update.yml"
        # test_profile lives in roles/ next to this playbook
        patching_profiles:
          - test_profile
        # Containers cannot reboot
        patching_reboot: never
        patching_summary_dir: "{{ (lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') or '/tmp/molecule-patching') }}/reports"
        patching_summary_write: true
