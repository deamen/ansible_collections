---
# Run a download-only pass before installing, so repository problems fail the run before anything changes
patching_download_first: true

# Package globs never updated by this role; empty means nothing is excluded
patching_exclude_packages: []

# Task files run in the post_reboot phase; empty means no hooks
patching_post_reboot_hooks: []

# Ports that must accept connections after patching, as {host, port, timeout}; empty means no port checks
patching_post_reboot_ports: []

# Systemd units that must be active after patching; empty means no service checks
patching_post_reboot_services: []

# URLs that must respond after patching, as {url, status, content, validate_certs}; empty means no URL checks
patching_post_reboot_urls: []

# Task files run in the post_update phase; empty means no hooks
patching_post_update_hooks: []

# Task files run in the pre_update phase; empty means no hooks
patching_pre_update_hooks: []

patching_preflight: true

patching_preflight_lock_timeout: 300

# Minimum free space in MiB for the filesystem holding each path
patching_preflight_min_free_mb:
  /: 1024
  /boot: 200
  /var/cache: 1024

# Profile roles (FQCNs) run in every extension phase; empty because service profiles are site-specific
patching_profiles: []

# auto: reboot only when updates were installed and needs-restarting says so; always; never
patching_reboot: auto

patching_reboot_timeout: 600

# List pending updates and write the summary without changing the host
patching_report_only: false

patching_security_only: false

patching_service_check_delay: 10

patching_service_check_retries: 3

# Skip this host: record skip_reason in the summary and end the host without failing it
patching_skip: false

# Only read when patching_skip is true
patching_skip_reason: not set

patching_summary_dir: "{{ playbook_dir }}/patching_reports"

patching_summary_write: false

# Seconds before the download or install step is stopped as hung; high enough for a large update on a slow host
patching_update_timeout: 3600

patching_verify_kernel: true
