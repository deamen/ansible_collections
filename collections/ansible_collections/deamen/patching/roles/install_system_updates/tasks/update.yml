---
- name: Update - Download and install updates
  block:
    - name: Update - Set the current step
      ansible.builtin.set_fact:
        patching_step: download

    - name: Update - Download updates
      ansible.builtin.dnf:
        name: "*"
        state: latest # noqa: package-latest
        download_only: true
        exclude: "{{ patching_effective_excludes }}"
        security: "{{ patching_security_only | bool }}"
        update_cache: true
      # A stalled mirror can hang dnf indefinitely; the timeout fails the step so the rescue below runs the cleanup
      timeout: "{{ patching_update_timeout }}"
      when: patching_download_first | bool
      # Molecule's idempotence run skips this: the test containers use live repositories, and packages published
      # between converge and idempotence would otherwise show up as changes
      tags:
        - molecule-idempotence-notest

    - name: Update - Set the current step
      ansible.builtin.set_fact:
        patching_step: update

    - name: Update - Install updates
      ansible.builtin.dnf:
        name: "*"
        state: latest # noqa: package-latest
        exclude: "{{ patching_effective_excludes }}"
        security: "{{ patching_security_only | bool }}"
        update_cache: true
      register: patching_update_result
      # Same as the download: fail a hung install into the rescue rather than block the batch
      timeout: "{{ patching_update_timeout }}"
      # Skipped in Molecule's idempotence run for the same reason as the download
      tags:
        - molecule-idempotence-notest

    - name: Update - Record whether updates were installed
      ansible.builtin.set_fact:
        patching_updates_installed: "{{ patching_update_result is changed }}"

  # Extensions may have changed state in pre_update (stopped services, versionlocks), so give them the
  # post_update and post_reboot phases to undo it before the host fails
  rescue:
    - name: Update - Record the failed update
      ansible.builtin.set_fact:
        patching_update_error: "{{ ansible_failed_result.msg | default('unknown error') }}"
        patching_update_failed: true

    - name: Update - Run post_update extensions for cleanup
      ansible.builtin.include_tasks: run_extensions.yml
      vars:
        patching_phase: post_update

    - name: Update - Run post_reboot extensions for cleanup
      ansible.builtin.include_tasks: run_extensions.yml
      vars:
        patching_phase: post_reboot

    - name: Update - Fail after cleanup
      ansible.builtin.fail:
        msg: "{{ patching_update_error }}"
